<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Avengers Character Search</title>
        <link rel="stylesheet" href="styles.css"/>
        <script src="app.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Avengers Character Search</h1>
        </header>

        <main>
            <label for="search">Search by Full Name or Alias</label>
            <div class="search-row">
                <input type="text" id="search" name="search" placeholder="e.g. Ironman or Tony Stark"/>
                <button id="search-btn" type="button">Search</button>
            </div>

            <h2>Result</h2>
            <div id="result"></div>
        </main>
    </body>
</html>
